<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Page Not Found · JCDM Technologies LLC</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to JCDM Technologies LLC.">
  <meta name="robots" content="noindex,follow">

  <link rel="icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

  <link rel="stylesheet" href="/styles.css" />

  <style>
    .error-section {
      min-height: calc(100svh - 68px - 200px);
      display: flex;
      align-items: center;
      padding: 80px 0;
    }
    .error-code {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--gold);
      opacity: 0.18;
      margin: 0 0 -1.5rem;
      user-select: none;
    }
    .error-headline {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(1.8rem, 4vw + .5rem, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 1rem;
    }
    .error-lead {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 440px;
      line-height: 1.7;
      margin: 0 0 2.5rem;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .error-links {
      margin-top: 3.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .error-links-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .error-link-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .error-link-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.88rem;
      color: var(--text);
      background: var(--card);
      transition: border-color .15s, background .15s;
    }
    .error-link-pill:hover {
      border-color: var(--gold-line);
      background: var(--card-solid);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <section class="error-section">
    <div class="container">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="error-headline" data-es="Página no encontrada">Page not found</h1>
      <p class="error-lead" data-es="La página que buscas no existe o fue movida. Regresa al inicio o explora nuestros servicios.">
        The page you're looking for doesn't exist or may have been moved.
        Head back home or explore what we offer.
      </p>

      <div class="error-actions">
        <a href="/" class="btn btn-primary" data-es="Ir al inicio">Go home</a>
        <a href="/contact.html" class="btn" data-es="Contacto">Contact us</a>
      </div>

      <div class="error-links">
        <p class="error-links-title" data-es="O ve directamente a">Or go directly to</p>
        <div class="error-link-grid">
          <a href="/services/" class="error-link-pill" data-es="Servicios">Services</a>
          <a href="/quelvo/" class="error-link-pill">QUELVO</a>
          <a href="/music-ride/" class="error-link-pill">Music Ride</a>
          <a href="/projects/" class="error-link-pill" data-es="Proyectos">Projects</a>
          <a href="/about.html" class="error-link-pill" data-es="Nosotros">About</a>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="/js/app.js"></script>
</body>
</html>
